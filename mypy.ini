[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
plugins = pydantic.mypy

[mypy-recovery_manager.worker]
# SQLAlchemy's nullable query result narrows immediately after the runtime guard.
disable_error_code = assignment

[mypy-recovery_manager.cli]
# The Typer dependency factory is strongly runtime-checked; preserve the CLI's concise command signatures.
disable_error_code = operator, unused-ignore
