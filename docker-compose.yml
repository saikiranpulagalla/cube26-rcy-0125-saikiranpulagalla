services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: recovery
      POSTGRES_USER: recovery_admin
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_admin -d recovery"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
