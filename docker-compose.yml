services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: recovery
      POSTGRES_USER: recovery_admin
      POSTGRES_PASSWORD: ${RECOVERY_ADMIN_DB_PASSWORD:?set RECOVERY_ADMIN_DB_PASSWORD in .env}
      RECOVERY_OWNER_DB_PASSWORD: ${RECOVERY_OWNER_DB_PASSWORD:?set RECOVERY_OWNER_DB_PASSWORD in .env}
      RECOVERY_APP_DB_PASSWORD: ${RECOVERY_APP_DB_PASSWORD:?set RECOVERY_APP_DB_PASSWORD in .env}
      RECOVERY_WORKER_DB_PASSWORD: ${RECOVERY_WORKER_DB_PASSWORD:?set RECOVERY_WORKER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_admin -d recovery"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
