name: application-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recovery
          POSTGRES_USER: recovery_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recovery_admin -d recovery"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RECOVERY_DATABASE_URL: postgresql+psycopg://recovery_app@localhost:5432/recovery
      RECOVERY_MIGRATION_DATABASE_URL: postgresql+psycopg://recovery_owner@localhost:5432/recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime roles
        run: psql postgresql://recovery_admin@localhost:5432/recovery -f infra/postgres/init/01-roles.sql
      - name: Install
        run: python -m pip install -e . && python -m pip install pytest==8.3.4 ruff==0.9.5 mypy==1.15.0
      - name: Migrate
        run: alembic upgrade head
      - name: Lint
        run: ruff check src tests alembic
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q
